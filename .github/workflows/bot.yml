name: Music Bot

# ─── Khi nào chạy ────────────────────────────────────────────────
# GitHub giới hạn 1 job tối đa 6 giờ → đặt lịch mỗi 5 giờ để job mới
# khởi động trước khi job cũ bị kill. Cron có độ lệch ngẫu nhiên để
# tránh GitHub delay hàng loạt vào đúng phút tròn.
on:
  workflow_dispatch:
    inputs:
      bot:
        description: "Chạy bot nào (2/3/all)"
        default: "all"
        required: false
  schedule:
    - cron: "23 */5 * * *"
  push:
    branches: [master]
    paths:
      - "bot.js"
      - "application.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/bot.yml"

jobs:
  run:
    name: Bot ${{ matrix.bot }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Mỗi bot một nhóm riêng — KHÔNG dùng chung group (đây là lỗi cũ khiến
    # 2 workflow huỷ lẫn nhau mỗi 5 giờ).
    # Lưu ý: `matrix` chỉ dùng được ở concurrency cấp JOB, không dùng được ở cấp workflow.
    concurrency:
      group: music-bot-${{ matrix.bot }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Bot 1 đã tắt. Bot 2 và 3 đều dùng node Lavalink công khai (không chạy Lavalink cục bộ).
        # node_index khác nhau để mỗi bot ưu tiên một node khác nhau, tránh dồn tải.
        include:
          - bot: 2
            token_env: DISCORD_TOKEN_2
            node_index: 0
            local_lavalink: "0"
          - bot: 3
            token_env: DISCORD_TOKEN_3
            node_index: 1
            local_lavalink: "0"

    env:
      DISCORD_TOKEN_2: ${{ secrets.DISCORD_TOKEN_2 }}
      DISCORD_TOKEN_3: ${{ secrets.DISCORD_TOKEN_3 }}
      TOKEN_ENV: ${{ matrix.token_env }}
      BOT_NODE_INDEX: ${{ matrix.node_index }}
      USE_LOCAL_LAVALINK: ${{ matrix.local_lavalink }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --omit=dev || npm install --omit=dev

      - name: Run bot (tự restart khi crash)
        run: bash scripts/run.sh

      - name: Upload logs khi job kết thúc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-${{ matrix.bot }}-logs
          path: "*.log"
          retention-days: 3
          if-no-files-found: ignore

server:
  port: ${LAVALINK_PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.0"
      repository: "https://maven.lavalink.dev/releases"
  server:
    password: ${LAVALINK_SERVER_PASSWORD:youshallnotpass}
    sources:
      youtube: false        # dùng youtube-plugin bên dưới thay vì source built-in
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      nico: false
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      timescale: true
      tremolo: true
      vibrato: true
      rotation: true
      channelMix: true
      lowPass: true
      karaoke: true
      distortion: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    # OAuth giúp tránh bị YouTube chặn khi chạy lâu.
    # Bật bằng cách chạy Lavalink 1 lần và làm theo hướng dẫn trong log.
    oauth:
      enabled: false
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "VietUniverseMusicBot"
    clients:
      - MUSIC
      - WEB
      - WEBEMBEDDED
      - ANDROID_VR
      - TV
      - TVHTML5_SIMPLY
      - IOS

logging:
  file:
    path: ./logs/
  level:
    root: WARN
    lavalink: INFO
    dev.lavalink.youtube: INFO
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 2

app = "vietuniverse-music-bot"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  USE_LOCAL_LAVALINK = "1"
  LAVALINK_HOST = "127.0.0.1"
  LAVALINK_PORT = "2333"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "90s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
